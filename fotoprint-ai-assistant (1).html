<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Фотопринт · AI-ассистент руководителя</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);
  --bg:#fff; --surface:#f8fafd; --line:#dadce0; --line2:#e8eaed; --text:#1f1f1f; --muted:#5f6368; --soft:#80868b;
  --primary:#0b57d0; --primary-bg:#d3e3fd; --primary-soft:#e8f0fe; --hover:#f1f3f4;
  --tomato:#d50000; --flamingo:#e67c73; --tangerine:#f4511e; --banana:#f6bf26; --sage:#33b679; --basil:#0b8043;
  --peacock:#039be5; --blueberry:#3f51b5; --lavender:#7986cb; --grape:#8e24aa; --graphite:#616161;
  --ok:#137333; --ok-bg:#e6f4ea; --warn:#b06000; --warn-bg:#fef7e0; --err:#c5221f; --err-bg:#fce8e6;
  --radius:12px; --shadow:0 1px 3px rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15);
  --hour:48px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Roboto,Arial,sans-serif;color:var(--text);background:var(--bg);font-size:14px;line-height:1.4;overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
.ms{font-size:20px;width:1em;height:1em;line-height:1;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;flex:none;overflow:hidden;color:inherit;user-select:none;white-space:nowrap}
.ms svg{width:100%;height:100%;fill:currentColor;display:block}
.ms:not(.ok-i){font-size-adjust:none}
.app{display:grid;grid-template-rows:calc(64px + var(--sat)) 1fr;height:100vh;height:100dvh;padding:0 var(--sar) 0 var(--sal)}
/* top bar */
.top{display:flex;align-items:center;gap:8px;padding:var(--sat) 12px 0 8px;border-bottom:1px solid var(--line);min-width:0;overflow:hidden}
.top>*{flex-shrink:0}
.top .spacer{flex:1 1 0;min-width:0}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--hover)}
.brand{display:flex;align-items:center;gap:10px;padding-right:28px;font-size:20px;color:var(--muted);white-space:nowrap}
.logo{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,#4285f4 0 50%,#34a853 50%);display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;position:relative}
.logo::after{content:"";position:absolute;right:-3px;bottom:-3px;width:14px;height:14px;border-radius:50%;background:#fbbc04;border:2px solid #fff}
.btn{min-height:36px;height:auto;padding:4px 16px;line-height:1.2;border-radius:18px;border:1px solid var(--line);font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;background:#fff}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn.primary:hover{background:#0842a0}
.btn.tonal{background:var(--primary-bg);border-color:transparent;color:#041e49}
.btn.tonal:hover{background:#c2d7fb}
.btn.text{border-color:transparent;color:var(--primary);padding:0 12px}
.btn.text:hover{background:var(--primary-soft)}
.btn.danger{color:var(--err);border-color:#f3c3bf}
.btn.sm{min-height:30px;padding:3px 12px;font-size:13px}
.date-title{font-size:22px;margin-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:1!important;min-width:0}
.spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.seg button{height:34px;padding:0 14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--primary-bg);color:#041e49}
.role{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:20px;padding:3px 10px 3px 4px}
.role select{border:0;background:transparent;font-weight:500;max-width:190px}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:500;font-size:13px;flex:none}
.bell{position:relative}
.bell .dot{position:absolute;top:7px;right:7px;min-width:16px;height:16px;border-radius:8px;background:var(--tomato);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
/* layout */
.body{display:grid;grid-template-columns:256px 1fr auto;min-height:0}
.side{padding:8px 12px calc(16px + var(--sab)) 8px;overflow:auto}
.create{height:56px;border-radius:16px;padding:0 20px 0 14px;display:flex;align-items:center;gap:10px;font-weight:500;background:#fff;box-shadow:0 1px 2px rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);margin:8px 0 16px 0}
.create:hover{box-shadow:var(--shadow);background:var(--surface)}
.create .plus{font-size:30px;color:var(--primary)}
.menu{position:absolute;background:#fff;border-radius:8px;box-shadow:var(--shadow);padding:8px 0;z-index:60;min-width:240px}
.menu button{display:flex;align-items:center;gap:14px;width:100%;padding:10px 18px;text-align:left}
.menu button:hover{background:var(--hover)}
.menu small{display:block;color:var(--muted);font-size:12px}
.nav a{display:flex;align-items:center;gap:14px;min-height:40px;line-height:1.25;padding:0 16px;border-radius:20px;color:var(--text);text-decoration:none;font-weight:500;cursor:pointer}
.nav a:hover{background:var(--hover)}
.nav a.active{background:var(--primary-bg);color:#041e49}
.nav .count{margin-left:auto;font-size:12px;background:var(--tomato);color:#fff;border-radius:10px;padding:1px 7px}
.nav .count.n{background:transparent;color:var(--muted)}
.side h4{font-size:14px;font-weight:500;margin:18px 0 6px 12px}
.cal-item{display:flex;align-items:center;gap:12px;padding:5px 12px;border-radius:6px;cursor:pointer}
.cal-item:hover{background:var(--hover)}
.cb{width:18px;height:18px;border-radius:3px;display:grid;place-items:center;color:#fff;font-size:14px;border:2px solid currentColor}
.mini{padding:0 4px 0 8px}
.mini-head{display:flex;align-items:center;justify-content:space-between;font-weight:500;padding:4px 0;gap:4px}
.mini-head>span:last-child{display:flex;flex:none}
.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;gap:2px 0}
.mini-grid span{height:26px;display:grid;place-items:center;border-radius:50%;cursor:pointer;width:26px;margin:auto}
.mini-grid span.h{color:var(--muted);cursor:default}
.mini-grid span.o{color:#b0b3b8}
.mini-grid span:not(.h):hover{background:var(--hover)}
.mini-grid span.t{background:var(--primary);color:#fff}
.mini-grid span.w{background:var(--primary-soft)}
.main{min-width:0;overflow:hidden;display:flex;flex-direction:column;border-left:1px solid transparent}
.view{display:none;flex:1;min-height:0;overflow:auto}
.view.on{display:flex;flex-direction:column}
/* calendar */
.cal-head{display:grid;grid-template-columns:64px repeat(var(--days),1fr) 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:5}
.cal-head .tz{font-size:10px;color:var(--muted);align-self:end;padding:0 0 6px 8px}
.dayh{text-align:center;padding:8px 0 6px;cursor:pointer}
.dayh .dw{font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.8px}
.dayh .dn{font-size:24px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;margin:2px auto 0}
.dayh:hover .dn{background:var(--hover)}
.dayh.today .dw{color:var(--primary)}
.dayh.today .dn{background:var(--primary);color:#fff}
.allday{grid-column:2/-2;display:grid;grid-template-columns:repeat(var(--days),1fr);min-height:4px}
.allday .dl{margin:1px 4px;font-size:12px;border-radius:4px;padding:2px 6px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.cal-scroll{flex:1;overflow:auto;position:relative}
.grid{display:grid;grid-template-columns:64px repeat(var(--days),1fr);position:relative}
.hours div{height:var(--hour);font-size:10px;color:var(--muted);text-align:right;padding-right:8px;transform:translateY(-6px)}
.col{position:relative;border-left:1px solid var(--line2)}
.slot{height:var(--hour);border-bottom:1px solid var(--line2)}
.slot:hover{background:rgba(11,87,208,.04)}
.ev{position:absolute;left:2px;right:6px;border-radius:6px;padding:2px 22px 2px 7px;color:#fff;font-size:12px;overflow:hidden;cursor:pointer;line-height:1.25;border:1px solid #fff;user-select:none;touch-action:none}
.ev b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .t{opacity:.9;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.focus{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.12) 0 6px,transparent 6px 12px)}
.ev.pending{background:#fff!important;color:var(--text);border:1.5px dashed var(--primary)}
.ev.dragging{opacity:.75;box-shadow:var(--shadow);z-index:20}
.ev .badge{position:absolute;right:5px;top:3px;font-size:16px}
.now{position:absolute;left:0;right:0;height:2px;background:#ea4335;z-index:4;pointer-events:none}
.now::before{content:"";position:absolute;left:-6px;top:-5px;width:12px;height:12px;border-radius:50%;background:#ea4335}
/* popover */
.pop{position:fixed;z-index:70;width:420px;max-width:calc(100vw - 24px - var(--sal) - var(--sar));max-height:calc(100dvh - 24px - var(--sat) - var(--sab));overflow:auto;background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:8px 8px 16px}
.pop-tools{display:flex;justify-content:flex-end;gap:2px}
.pop-row{display:grid;grid-template-columns:40px 1fr;gap:8px;padding:6px 16px 6px 12px;align-items:start}
.pop-row .ms{color:var(--muted);margin-top:2px}
.pop h3{margin:0;font-size:22px;font-weight:400}
.sq{width:14px;height:14px;border-radius:4px;margin:5px 0 0 3px}
.muted{color:var(--muted)}
.small{font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 4px;border-radius:14px;border:1px solid var(--line);font-size:13px;background:#fff}
.chip .avatar{width:22px;height:22px;font-size:10px}
.chip.busy{border-color:#f3c3bf;background:var(--err-bg)}
.chip button{color:var(--muted);margin-left:2px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:10px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
.p1{background:var(--err-bg);color:var(--err)} .p2{background:#feefe3;color:#b3410b} .p3{background:var(--primary-soft);color:var(--primary)} .p4{background:#f1f3f4;color:var(--muted)}
.ok{background:var(--ok-bg);color:var(--ok)} .warn{background:var(--warn-bg);color:var(--warn)} .err{background:var(--err-bg);color:var(--err)} .info{background:var(--primary-soft);color:var(--primary)} .neutral{background:#f1f3f4;color:#3c4043}
/* page views */
.page{padding:20px 28px 40px;max-width:1280px;width:100%}
.page h1{font-size:24px;font-weight:400;margin:4px 0 4px}
.page .sub{color:var(--muted);margin:0 0 18px}
.cards{display:grid;gap:16px}
.card{border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:16px 18px}
.card h2{font-size:16px;font-weight:500;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 .spacer{flex:1}
.today-grid{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}
.cards>*{min-width:0}
.src{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.ai-card{background:linear-gradient(135deg,#eef3fe,#f6f0fd);border-color:#d7e1f8}
.ai-label{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:#5b3fa8}
.src{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--primary);background:#fff;border:1px solid #c6d6f5;border-radius:10px;padding:1px 7px;margin:2px 2px 0 0;cursor:pointer;white-space:nowrap}
.src:hover{background:var(--primary-soft)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:62px 4px 1fr auto;gap:12px;padding:9px 0;border-bottom:1px solid var(--line2);align-items:center}
.tl li:last-child{border-bottom:0}
.tl .bar{align-self:stretch;border-radius:2px}
.tl .time{color:var(--muted);font-size:13px}
.tl .past{opacity:.5}
.rem{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line2)}
.rem:last-child{border-bottom:0}
.rem .ms{color:var(--warn)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{border:1px solid var(--line2);border-radius:10px;padding:10px 12px}
.kpi .v{font-size:22px;margin:2px 0}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .d{font-size:12px}
.up{color:var(--ok)} .down{color:var(--err)}
/* tasks board */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{display:flex;align-items:center;gap:8px;background:#f1f3f4;border-radius:20px;padding:0 14px;height:38px;min-width:260px}
.search input{border:0;background:transparent;flex:1;outline:none}
.fsel{height:34px;border:1px solid var(--line);border-radius:17px;padding:0 10px;background:#fff}
.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;align-items:start}
.lane{background:var(--surface);border-radius:var(--radius);padding:10px;min-height:200px}
.lane h3{font-size:13px;font-weight:500;margin:4px 6px 10px;display:flex;justify-content:space-between;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.lane.over{outline:2px dashed var(--primary);outline-offset:-4px}
.tcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;cursor:pointer;position:relative}
.tcard:hover{box-shadow:0 1px 3px rgba(60,64,67,.25)}
.tcard .ttl{font-weight:500;margin:6px 0 6px;line-height:1.35}
.tcard .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.tcard .kpi-line{font-size:12px;color:#3c4043;background:#f8f9fa;border-radius:6px;padding:4px 8px;margin:6px 0}
.tcard .lock{display:flex;align-items:center;gap:6px;font-size:12px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.overdue{color:var(--err)!important;font-weight:500}
/* requests */
.req{display:grid;grid-template-columns:40px 1fr auto;gap:14px;padding:14px 0;border-bottom:1px solid var(--line2);align-items:start}
.req:last-child{border-bottom:0}
.req .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.req .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{padding:10px 16px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--primary);border-color:var(--primary)}
/* meeting notes */
.notes{display:grid;grid-template-columns:1fr 1.1fr;gap:16px;align-items:start}
.rec{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;background:#f8f9fa;margin-bottom:12px;flex-wrap:wrap}
.recbtn{width:48px;height:48px;border-radius:50%;background:var(--tomato);color:#fff;display:grid;place-items:center;flex:none}
.recbtn.on{animation:pulse 1.3s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(213,0,0,.45)}70%{box-shadow:0 0 0 12px rgba(213,0,0,0)}100%{box-shadow:0 0 0 0 rgba(213,0,0,0)}}
.wave{display:flex;gap:2px;align-items:center;height:28px;flex:1;min-width:80px}
.wave i{width:3px;background:#c4c7c5;border-radius:2px;height:4px;transition:height .15s}
.transcript{max-height:440px;overflow:auto;font-size:13px;line-height:1.5}
.tline{padding:6px 4px;border-radius:6px;display:grid;grid-template-columns:44px 1fr;gap:8px}
.tline.hl{background:#fff8e1}
.tline .ts{color:var(--soft);font-size:11px;padding-top:2px}
.tline b{font-weight:500}
.mynote{width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical;margin-top:8px}
.prot-sec{margin-bottom:14px}
.prot-sec h4{margin:0 0 6px;font-size:13px;display:flex;align-items:center;gap:6px}
.pitem{display:grid;grid-template-columns:1fr auto;gap:8px;padding:7px 10px;border:1px solid var(--line2);border-radius:8px;margin-bottom:6px;align-items:start;background:#fff}
.pitem [contenteditable]{outline:none;border-radius:4px;padding:0 2px}
.pitem [contenteditable]:focus{background:var(--primary-soft)}
.ptask{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:8px 10px;border:1px solid var(--line2);border-radius:8px;margin-bottom:6px;background:#fff}
.ptask .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ptask select{height:28px;border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:12px;background:#fff}
.ptask select.need{border-color:#f9ab00;background:var(--warn-bg)}
.mlist{display:grid;gap:8px}
.mrow{display:grid;grid-template-columns:4px 1fr auto;gap:12px;padding:12px;border:1px solid var(--line);border-radius:10px;align-items:center;cursor:pointer}
.mrow:hover{background:var(--surface)}
.mrow .bar{align-self:stretch;border-radius:2px}
/* audit */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:12px;position:sticky;top:0;background:#fff}
/* assistant panel */
.aside{width:0;overflow:hidden;transition:width .2s;border-left:1px solid var(--line);display:flex;flex-direction:column;background:#fff}
.aside.open{width:380px}
.aside-in{width:380px;display:flex;flex-direction:column;height:100%}
.aside-h{display:flex;align-items:center;gap:8px;padding:12px calc(8px + 0px) 12px 16px;border-bottom:1px solid var(--line2)}
.aside-h b{font-weight:500;font-size:16px}
.chat{flex:1;overflow:auto;padding:14px 14px 4px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;padding:10px 12px;border-radius:14px;line-height:1.45;font-size:13.5px}
.msg.u{align-self:flex-end;background:var(--primary-bg);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:#f1f3f4;border-bottom-left-radius:4px}
.msg.a.deny{background:var(--err-bg)}
.msg .fb{display:flex;gap:2px;margin-top:6px}
.msg .fb button{color:var(--muted);width:26px;height:26px;border-radius:50%}
.msg .fb button:hover{background:#e3e3e3}
.msg .fb button.on{color:var(--primary)}
.sugg{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px}
.sugg button{border:1px solid var(--line);border-radius:16px;padding:5px 11px;font-size:12px;background:#fff}
.sugg button:hover{background:var(--primary-soft);border-color:#c6d6f5}
.composer{display:flex;gap:6px;padding:10px 12px calc(14px + var(--sab));border-top:1px solid var(--line2)}
.composer input{flex:1;height:42px;border:1px solid var(--line);border-radius:21px;padding:0 16px;outline:none}
.composer input:focus{border-color:var(--primary)}
.fab{position:fixed;right:calc(20px + var(--sar));bottom:calc(20px + var(--sab));z-index:40;height:52px;border-radius:16px;padding:0 18px 0 14px;display:flex;align-items:center;gap:8px;background:#c2e7ff;font-weight:500;box-shadow:var(--shadow)}
.fab:hover{background:#a8dcff}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(32,33,36,.45);z-index:80;display:none;align-items:center;justify-content:center;padding:calc(16px + var(--sat)) calc(16px + var(--sar)) calc(16px + var(--sab)) calc(16px + var(--sal))}
.scrim.on{display:flex}
.modal{background:#fff;border-radius:24px;width:720px;max-width:100%;max-height:100%;min-height:0;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.modal.wide{width:900px}
.modal.narrow{width:520px}
.mh{display:flex;align-items:center;gap:10px;padding:18px 18px 8px 24px}
.mh h2{margin:0;font-size:20px;font-weight:400;flex:1}
.mb{padding:8px 24px 12px;overflow:auto}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px 18px;border-top:1px solid var(--line2);align-items:center;flex-wrap:wrap}
.mf .left{flex:1 1 220px;min-width:0}
.mf .left{margin-right:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.field{margin-bottom:14px}
.field>label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:5px}
.inp{width:100%;height:40px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:#fff;outline:none}
textarea.inp{height:auto;min-height:70px;padding:9px 12px;resize:vertical;line-height:1.4}
.inp:focus{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.inp.big{font-size:20px;height:48px;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:0 2px}
.inp.big:focus{box-shadow:none;border-bottom:2px solid var(--primary)}
.inp.need{border-color:#f9ab00;background:var(--warn-bg)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.need-lbl{color:var(--warn);font-size:12px;display:flex;align-items:center;gap:4px;margin-top:4px}
.slots{display:grid;gap:8px}
.slotopt{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;text-align:left;width:100%}
.slotopt:hover{background:var(--surface)}
.slotopt[aria-pressed=true]{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 0 0 1px var(--primary)}
.slotopt .when{font-weight:500}
.slotopt>span:nth-child(2),.pitem>span,.ptask>div,.rem>div,.req>div:nth-child(2),.tcard .ttl{min-width:0;overflow-wrap:anywhere}
.prio{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.prio button{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:left;font-size:12px;color:var(--muted)}
.prio button b{display:block;font-size:13px;color:var(--text);font-weight:500;margin-bottom:2px}
.prio button[aria-pressed=true]{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 0 0 1px var(--primary)}
.preview{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface);font-size:13.5px;line-height:1.5}
.preview dl{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;margin:0}
.preview dt{color:var(--muted)}
.preview dd{margin:0}
.alert{display:flex;gap:10px;padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:12px;align-items:flex-start}
.alert .ms{font-size:20px}
.agenda li{margin-bottom:6px}
.steps{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin:0 0 14px}
.steps span{padding:3px 10px;border-radius:12px;background:#f1f3f4}
.steps span.on{background:var(--primary-bg);color:#041e49;font-weight:500}
.hist{font-size:12px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px;margin-top:6px}
.hist div{margin-bottom:4px}

/* month */
.month-wrap{flex:1;display:flex;flex-direction:column;min-height:0;overflow:auto}
.mhead{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.mhead div{text-align:center;font-size:11px;font-weight:500;color:var(--muted);padding:8px 0 6px;letter-spacing:.8px}
.mgrid{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-height:560px}
.mcell{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:4px 4px 6px;min-width:0;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-height:96px}
.mcell:hover{background:rgba(11,87,208,.03)}
.mcell.out{background:#fafafa}.mcell.out .mnum{color:#9aa0a6}
.mcell.we{background:#fcfcfd}
.mnum{align-self:center;font-size:12px;font-weight:500;min-width:26px;height:26px;padding:0 6px;border-radius:13px;display:grid;place-items:center;margin-bottom:2px;white-space:nowrap}
.mnum:hover{background:var(--hover)}.mnum.today{background:var(--primary);color:#fff}
.mev{display:flex;align-items:center;gap:5px;width:100%;min-width:0;font-size:12px;line-height:1.3;padding:2px 6px;border-radius:4px;text-align:left}
.mev:hover{background:var(--hover)}
.mev i{width:8px;height:8px;border-radius:50%;flex:none}
.mev .mt{color:var(--muted);flex:none}
.mev .mn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mev.dl{color:#fff}.mev.dl:hover{filter:brightness(.95)}
.mmore{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:1px 6px;border-radius:4px}
.mmore:hover{background:var(--hover);color:var(--text)}
/* history */
.fchip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:4px 12px;border:1px solid var(--line);border-radius:8px;font-weight:500;font-size:13px;color:#3c4043;background:#fff}
.fchip .ms{font-size:18px}
.fchip[aria-pressed=true]{background:var(--primary-bg);border-color:transparent;color:#041e49}
.hgroup{font-size:12px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:2px 0 6px}
.hrow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line2)}
.hrow:last-child{border-bottom:0}
.hic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.htxt{min-width:0;overflow-wrap:anywhere;line-height:1.45}
.htxt b{font-weight:500}
.hobj{color:#3c4043}
.htime{font-size:12px;color:var(--muted);padding-top:2px}
/* toast */
.toast{position:fixed;left:calc(16px + var(--sal));right:auto;bottom:calc(24px + var(--sab));background:#323232;color:#fff;padding:12px 16px;border-radius:8px;display:flex;gap:16px;align-items:center;z-index:95;box-shadow:var(--shadow);transform:translateY(120px);transition:transform .2s;max-width:520px;font-size:14px}
.toast.on{transform:none}
.toast span{min-width:0}
.toast button{color:#a8c7fa;font-weight:500}
.notif{position:fixed;top:calc(60px + var(--sat));right:calc(70px + var(--sar));width:380px;max-width:calc(100vw - 16px);z-index:65}
.empty{padding:30px;text-align:center;color:var(--muted)}
.kbd{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted);background:#fff}
@media (max-width:1100px){.today-grid{grid-template-columns:1fr}.notes{grid-template-columns:1fr}.board{grid-template-columns:repeat(2,1fr)}.aside.open{width:340px}.aside-in{width:340px}}
/* ===== MY DAY · ROADMAP ===== */
#dayRoad.rm-page{max-width:none;padding:16px 20px 0;display:flex;flex-direction:column;min-height:100%}
.rm-top{display:flex;gap:16px;align-items:stretch;flex-wrap:wrap;margin-bottom:14px}
.rm-me{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line2);border-radius:24px;padding:12px 22px 12px 12px}
.rm-me .avatar{width:56px;height:56px;font-size:22px;border-radius:18px}
.rm-me small{display:block;font-size:11px;color:var(--muted)}
.rm-me b{font-weight:500;font-size:16px;line-height:1.2;display:block}
.rm-stats{flex:1;min-width:280px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.rm-nums{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end}
.rm-nums small{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
.rm-nums .big{font-size:24px;line-height:1}
.rm-nums .big i{font-style:normal;font-size:13px;color:var(--muted);margin-left:2px}
.rm-nums .date{font-size:20px;line-height:1.1}
.rm-fl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rm-fl .fbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);background:#fff}
.rm-fl .fchip{border-radius:18px;height:34px;min-height:34px}
.rm-fl .fchip[aria-pressed=false]{background:#f1f3f4;border-color:transparent;color:var(--muted)}
.rm-mode{margin-left:auto;align-self:flex-start}
.rm-board{position:relative;flex:1;background:var(--surface);border:1px solid var(--line2);border-radius:28px;display:flex;flex-direction:column;min-height:520px;overflow:hidden}
.rm-scroll{flex:1;overflow:auto;scroll-snap-type:x proximity;scroll-behavior:smooth;padding:18px 0 24px;position:relative}
.rm-lane{position:relative;display:flex;width:max-content;min-height:100%;padding-right:40px}
.rm-track{position:absolute;left:0;right:0;top:28px;height:2px;background:var(--line)}
.rm-track .done{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#c4c7c5,var(--primary))}
.rm-nowpin{position:absolute;top:0;z-index:3;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
.rm-nowpin span{background:var(--primary);color:#fff;font-size:11px;font-weight:500;border-radius:10px;padding:2px 8px;white-space:nowrap}
.rm-nowpin::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 4px rgba(11,87,208,.18)}
.rm-col{position:relative;width:var(--colw,560px);flex:none;padding:84px 24px 0 64px;scroll-snap-align:start}
.rm-col::before{content:"";position:absolute;left:32px;top:48px;bottom:16px;border-left:1px solid #b8bcc2}
.rm-col.empty::before{bottom:auto;height:60px}
.rm-node{position:absolute;left:12px;top:8px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid var(--line);color:var(--muted);z-index:2}
.rm-node.past{background:#e6f4ea;border-color:#ceead6;color:var(--ok)}
.rm-node.live{background:#fde293;border-color:#fde293;color:#3c4043;box-shadow:0 0 0 6px rgba(253,226,147,.45)}
.rm-node.inbox{background:#fde293;border-color:#fde293;color:#3c4043}
.rm-node.end{background:#3c4043;border-color:#3c4043;color:#fff;cursor:pointer}
.rm-node .cnt{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:#3c4043;color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--surface)}
.rm-h{position:absolute;left:64px;top:54px;display:flex;align-items:baseline;gap:10px}
.rm-h b{font-weight:400;font-size:20px}
.rm-h span{font-size:12px;color:var(--muted)}
.rm-h .tag{align-self:center}
.rm-row{position:relative;display:grid;grid-template-columns:150px minmax(0,1fr);column-gap:34px;align-items:start;margin:0 0 18px}
.rm-row::after{content:"";position:absolute;left:-32px;top:22px;width:28px;border-top:1px solid #b8bcc2}
.rm-row::before{content:"";position:absolute;left:150px;top:22px;width:34px;height:18px;border-top:1px solid #b8bcc2;border-right:1px solid #b8bcc2;border-top-right-radius:14px}
.rm-row.solo{grid-template-columns:minmax(0,1fr)}
.rm-row.solo::before{display:none}
.rm-pills{display:flex;flex-direction:column;gap:8px;min-width:0}
.rm-pill{display:flex;align-items:center;height:44px;border-radius:22px;background:#80868b;color:#fff;padding:0 14px 0 0;text-align:left;min-width:0;width:100%}
.rm-pill:hover{filter:brightness(.95)}
.rm-pill .pi{width:44px;height:44px;flex:none;border-radius:50%;background:#fff;color:#3c4043;border:1px solid var(--line);display:grid;place-items:center;margin-right:10px}
.rm-pill .pt{min-width:0;display:flex;flex-direction:column;line-height:1.15;overflow:hidden}
.rm-pill .pt b{font-weight:500;font-size:13px;white-space:nowrap}
.rm-pill .pt small{font-size:11px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm-pill.past{background:#c4c7c5}
.rm-pill.live{background:var(--primary)}
.rm-pill.warn{background:#b06000}
.rm-pill.err{background:var(--err)}
.rm-pill.ai{background:#6e4bc9}
.rm-pill.free{background:#fff;color:var(--muted);border:1px dashed #b8bcc2}
.rm-pill.free .pi{border-style:dashed}
.rm-card{background:#fff;border-radius:22px;padding:14px 16px;box-shadow:0 1px 2px rgba(60,64,67,.08);border:1px solid var(--line2);min-width:0;position:relative}
.rm-card.past{opacity:.62}
.rm-card.live{border-color:#c6d6f5;box-shadow:0 0 0 2px rgba(11,87,208,.12)}
.rm-card.focus{background:repeating-linear-gradient(135deg,#f3f4fb 0 8px,#fff 8px 16px);border-color:#dfe2f3}
.rm-card.free{background:transparent;border:1px dashed #b8bcc2;box-shadow:none}
.rm-card.ai{background:linear-gradient(135deg,#eef3fe,#f6f0fd);border-color:#d7e1f8}
.rm-ch{display:flex;align-items:flex-start;gap:8px;margin-bottom:4px}
.rm-ch b{font-weight:400;font-size:17px;line-height:1.25;flex:1;min-width:0;overflow-wrap:anywhere}
.rm-ib{width:34px;height:34px;flex:none;border-radius:50%;background:#f1f3f4;display:grid;place-items:center;color:#3c4043;margin:-4px -4px 0 0}
.rm-ib:hover{background:#e3e3e3}
.rm-dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:7px}
.rm-meta{font-size:12px;color:var(--muted);display:flex;gap:4px 10px;flex-wrap:wrap;align-items:center}
.rm-meta .ms{font-size:15px}
.rm-avs{display:flex;margin:10px 0 2px}
.rm-avs .avatar{width:26px;height:26px;font-size:11px;border:2px solid #fff;margin-left:-6px}
.rm-avs .avatar:first-child{margin-left:0}
.rm-prog{height:4px;border-radius:2px;background:var(--primary-soft);margin:10px 0 2px;overflow:hidden}
.rm-prog i{display:block;height:100%;background:var(--primary)}
.rm-cf{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.rm-docs{margin-top:8px}
.rm-list{margin:4px 0 0}
.rm-li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line2)}
.rm-li:first-child{border-top:0}
.rm-li>div{flex:1;min-width:0;overflow-wrap:anywhere}
.rm-li .small{color:var(--muted)}
/* KPI chart card (как «Blood Pressure» на рефе) */
.rm-kpi svg{display:block;width:100%;height:76px;margin:6px 0 4px}
.rm-kfoot{display:flex;align-items:baseline;gap:6px;font-size:12px;color:var(--muted)}
.rm-kfoot b{font-size:20px;font-weight:400;color:var(--text)}
.rm-kfoot .d{margin-left:auto;font-size:18px}
.rm-kfoot .d.down{color:var(--err)}.rm-kfoot .d.up{color:var(--ok)}
/* bottom scrubber */
.rm-scrub{flex:none;margin:0 14px 14px;background:#fff;border-radius:22px;box-shadow:0 1px 3px rgba(60,64,67,.25);display:flex;align-items:center;gap:0;padding:6px;overflow-x:auto}
.rm-cal{width:44px;height:44px;border-radius:50%;background:#3c4043;color:#fff;display:grid;place-items:center;flex:none;margin-right:4px}
.rm-hr{flex:1 0 auto;min-width:54px;height:44px;display:flex;align-items:center;justify-content:center;gap:4px;border-radius:14px;font-size:11px;color:var(--soft);position:relative}
.rm-hr:hover{background:var(--hover)}
.rm-hr.cur{background:#3c4043;color:#e8eaed}
.rm-hr.cur.first{border-radius:22px 6px 6px 22px}.rm-hr.cur.last{border-radius:6px 22px 22px 6px}.rm-hr.cur.first.last{border-radius:22px}
.rm-hr.cur.mid{border-radius:6px}
.rm-hr .ic{width:28px;height:28px;border-radius:50%;background:#f1f3f4;color:#3c4043;display:grid;place-items:center;position:relative}
.rm-hr.cur .ic{background:#5f6368;color:#fff}
.rm-hr .ic .ms{font-size:15px}
.rm-hr .ic b{position:absolute;top:-5px;right:-5px;min-width:15px;height:15px;border-radius:8px;background:#fde293;color:#3c4043;font-size:9px;font-weight:700;display:grid;place-items:center;padding:0 3px}
.rm-hr .dotl{width:4px;height:4px;border-radius:50%;background:#dadce0}
.rm-hr.now-h::after{content:"";position:absolute;bottom:3px;left:50%;width:14px;height:3px;border-radius:2px;background:#fde293;transform:translateX(-50%)}

.rm-board.h-meet [data-k=meet]{display:none}.rm-board.h-focus [data-k=focus]{display:none}.rm-board.h-task [data-k=task]{display:none}.rm-board.h-req [data-k=req]{display:none}.rm-board.h-kpi [data-k=kpi]{display:none}

#dayRoad{flex:1;min-height:0;overflow:auto}
#roadBtn[aria-pressed=true]{background:var(--primary-bg);border-color:transparent;color:#041e49}
.inbox-card{margin-bottom:16px}
.inbox-card .req{padding:10px 0}
.eis{display:grid;grid-template-columns:72px 1fr 1fr;gap:8px;align-items:stretch}
.eis .ax{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;justify-content:center;text-align:center}
.eis .ax.v{justify-content:flex-start}
.eis button{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:9px 10px;text-align:left;font-size:12px;color:var(--muted);background:#fff}
.eis button b{display:block;font-size:13px;color:var(--text);font-weight:500;margin-bottom:2px}
.eis button[aria-pressed=true]{background:var(--bg);border-color:var(--c);box-shadow:0 0 0 1px var(--c)}
.eis button[aria-pressed=true] b{color:var(--c)}
.pdot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.tcard{border-left:4px solid var(--pc,#dadce0)}
.matrix{display:grid;grid-template-columns:28px 1fr 1fr;grid-template-rows:auto 1fr 1fr;gap:12px}
.matrix .mx-ax{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;text-align:center}
.matrix .mx-ax.v{writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;justify-content:center}
.quad{border-radius:var(--radius);padding:10px;min-height:180px;background:var(--qbg);border:1px solid transparent}
.quad.over{outline:2px dashed var(--qc);outline-offset:-4px}
.quad h3{margin:2px 4px 10px;font-size:14px;font-weight:500;color:var(--qc);display:flex;align-items:center;gap:8px}
.quad h3 small{font-weight:400;color:var(--muted);font-size:12px}
.quad h3 .n{margin-left:auto;color:var(--muted);font-size:12px}
.quad .tcard{background:#fff}
.pbars{display:grid;gap:8px}
.pbar{display:grid;grid-template-columns:190px 1fr 40px;gap:10px;align-items:center;font-size:13px}
.pbar .tr{height:10px;border-radius:5px;background:#f1f3f4;overflow:hidden}
.pbar .tr i{display:block;height:100%;border-radius:5px}

/* ===== calendar like the reference ===== */
#v-calendar{background:#eceef3;overflow:hidden}
.cx{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;padding:14px}
.cx-main{display:flex;flex-direction:column;gap:14px;min-height:0;min-width:0}
.cx-cal{flex:1;min-height:0;background:#fff;border-radius:26px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.cx-bar{display:flex;align-items:center;gap:4px;padding:14px 18px 8px 22px;flex-wrap:wrap}
.cx-bar .date-title{display:block!important;font-size:26px;margin:0 8px 0 0;color:#1f1f1f}
.cx-bar .date-title .yr{color:#9aa0a6;font-weight:300}
.cx-bar .seg{background:#1f1f1f;border:0;border-radius:22px;padding:3px}
.cx-bar .seg button{color:#c4c7c5;height:32px;border-radius:18px}
.cx-bar .seg button[aria-pressed=true]{background:#fff;color:#1f1f1f}
.cx-body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.cx-body .cal-scroll{flex:1}
.cx-body #dayRoad{padding:0}
#dayRoad .rm-board{border:0;border-radius:0;background:#fafbfc}
:root{--hour:56px}
.cal-head{border-bottom:0}
.dayh{display:flex;align-items:baseline;justify-content:center;gap:4px;padding:6px 0 12px}
.dayh .dn{font-size:34px;font-weight:300;width:auto;height:auto;margin:0;color:#c4c7c5;display:block;border-radius:0}
.dayh .dw{font-size:12px;color:#bdc1c6;letter-spacing:0;font-weight:400}
.dayh:hover .dn{background:none;color:#80868b}
.dayh.today .dn{background:none;color:#1f1f1f;font-weight:500}
.dayh.today .dw{color:#1f1f1f}
.col{border-left:0}
.col.today-col{background:linear-gradient(#f2edff,#f2edff) no-repeat;background-size:100% 100%}
.slot{border-bottom:1px dashed #edeef0}
.hours div{color:#9aa0a6}
.ev{border-radius:16px;color:#1f1f1f;border:3px solid #fff;padding:7px 26px 7px 11px;box-shadow:none}
.ev b{font-weight:600;font-size:12.5px}
.ev .t{opacity:.65;font-size:11.5px}
.ev .ev-av{display:flex;margin-top:6px}
.ev .ev-av .avatar{width:22px;height:22px;font-size:10px;border:2px solid #fff;margin-left:-6px}
.ev .ev-av .avatar:first-child{margin-left:0}
.ev .ev-av i{font-style:normal;font-size:10px;background:#fff;border-radius:11px;padding:3px 6px;margin-left:2px}
.ev.focus{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 6px,transparent 6px 12px)}
.ev .badge{color:#1f1f1f}
.now{background:#1f1f1f}.now::before{background:#1f1f1f}
/* widgets */
.cx-widgets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;flex:none}
.wg{background:#1f2024;color:#fff;border-radius:22px;padding:14px 18px 14px;min-height:186px;display:flex;flex-direction:column;min-width:0}
.wg-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.wg-h b{font-weight:500;font-size:15px}.wg-h span{font-size:11px;color:#9aa0a6;text-align:right}
.gauge{width:100%;max-width:230px;margin:0 auto;display:block}
.wg-n{display:flex;justify-content:space-around;margin-top:-4px}
.wg-n b{font-size:30px;font-weight:500;display:block;line-height:1}.wg-n b i{font-style:normal;font-size:14px;margin-left:2px}
.wg-n small,.wg-leg small{font-size:11px;color:#9aa0a6}
.bub{width:100%;max-height:128px;display:block;overflow:visible}
.wg-leg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.wg-leg b{font-size:18px;font-weight:500;display:block}
.wg-leg small{display:flex;gap:4px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars{flex:1;display:flex;align-items:flex-end;justify-content:space-around;gap:10px;padding-top:8px;min-height:100px}
.bc{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;height:100%;cursor:pointer}
.bst{flex:1;width:26px;display:flex;flex-direction:column;justify-content:flex-end;gap:3px}
.bst i{display:block;border-radius:6px;min-height:0}
.bst .m{background:#5f6368}.bst .f{background:#a98bff;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.25) 0 3px,transparent 3px 6px)}
.bc.on .bst .m{background:#f7ef8a}
.bc small{font-size:11px;color:#9aa0a6}.bc.on small{color:#fff}
.wg-leg2{display:flex;gap:14px;font-size:11px;color:#9aa0a6;margin-top:6px}.wg-leg2 i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
/* side panel */
.cx-side{background:#1c1d21;color:#fff;border-radius:26px;padding:16px;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:12px}
.sum{background:#f7ef8a;color:#1f1f1f;border-radius:22px;padding:14px 16px;border:0}
.sum.ai-card{background:#f7ef8a;border:0}
.sum-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#5f5a1a}
.sum-copy{width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.07);display:grid;place-items:center}
.sum-copy .ms{font-size:16px}
.sum-d{font-size:22px;margin:2px 0 10px}
.sum-n{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:10px}
.sum-n b{font-size:22px;font-weight:500;display:block;line-height:1.1}.sum-n b.bad{color:#c5221f}
.sum-n small{font-size:10.5px;color:#5f5a1a}
.sum p{margin:0;font-size:13px;line-height:1.45;border-top:1px solid rgba(0,0,0,.1);padding-top:10px}
.side-h{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}
.side-h b{font-size:20px;font-weight:500}.side-h b span{color:#9aa0a6;font-weight:400}
.side-link{color:#a8c7fa;font-size:12px}
.ux{border-radius:22px;padding:13px 15px;color:#1f1f1f}
.ux.purple{background:#c9b6ff}.ux.salmon{background:#ff9d8a}.ux.coral{background:#ffb59a}.ux.cyan{background:#8cecf2}.ux.green{background:#a8f0a0}
.ux-top{display:flex;align-items:center;gap:5px;font-size:11.5px;opacity:.75}.ux-top .ms{font-size:15px}
.ux-go{margin-left:auto;width:32px;height:32px;border-radius:50%;border:1.5px solid rgba(0,0,0,.55);display:grid;place-items:center;opacity:1;flex:none}
.ux-go:hover{background:rgba(255,255,255,.4)}
.ux-t{font-size:19px;line-height:1.2;margin:4px 0 6px;font-weight:500;overflow-wrap:anywhere}
.ux-d{font-size:12px;opacity:.75;margin-bottom:6px}
.ux-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.ux-av{display:flex}.ux-av .avatar{width:26px;height:26px;font-size:11px;border:2px solid rgba(255,255,255,.8);margin-left:-7px}.ux-av .avatar:first-child{margin-left:0}
.ux-av i{font-style:normal;font-size:11px;margin-left:4px;align-self:center}
.ux-meta{display:flex;align-items:center;gap:6px;font-size:12px}.ux-meta .avatar{width:22px;height:22px;font-size:10px}
.ux-st{font-size:11px;background:#1f1f1f;color:#fff;border-radius:12px;padding:3px 10px}
.ux-btn{border:1.5px solid #1f1f1f;border-radius:16px;padding:4px 14px;font-size:12px;font-weight:500}
.ux-btn:hover{background:rgba(255,255,255,.4)}
.ux-list{display:grid;gap:6px;font-size:12.5px}.ux-list div{display:flex;gap:8px;align-items:center}.ux-list .avatar{width:22px;height:22px;font-size:10px}
.ux .tag{background:rgba(255,255,255,.7)!important}
.side-empty{color:#9aa0a6;font-size:13px;padding:8px 2px}
.nlist{background:#26272c;border-radius:18px;padding:4px 12px}
.nrow{display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #34353a;font-size:12.5px}
.nrow:last-child{border-bottom:0}.nrow .ms{font-size:18px;color:#f7ef8a}.nrow .nt{min-width:0;overflow-wrap:anywhere;color:#e8eaed}
.nrow button{color:#a8c7fa;font-size:12px;white-space:nowrap}
/* create dialog */
.nl-in{font-size:15px;min-height:90px}
.nl-ex{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.nl-chip{border:1px dashed var(--line);border-radius:14px;padding:4px 10px;font-size:12px;color:var(--muted);text-align:left}
.nl-chip:hover{border-color:var(--primary);color:var(--primary)}
.nl-card{margin-top:12px;border-radius:16px;padding:12px 14px;background:linear-gradient(135deg,#eef3fe,#f6f0fd);border:1px solid #d7e1f8}
.nl-kinds{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.nl-card dl{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;margin:0;font-size:13.5px}.nl-card dt{color:var(--muted)}.nl-card dd{margin:0}
.nl-manual{font-size:12.5px;color:var(--muted);margin-top:12px}.nl-manual a{color:var(--primary);text-decoration:none}.nl-manual a:hover{text-decoration:underline}
@media (max-width:1100px){.cx{grid-template-columns:minmax(0,1fr) 300px}.cx-widgets{grid-template-columns:1fr 1fr}.cx-widgets .wg:last-child{grid-column:1/-1}}

/* ===== layout without sidebar, folder tabs on top ===== */
.body{grid-template-columns:1fr!important}
.top{height:auto;min-height:64px;align-items:flex-end;padding:calc(10px + var(--sat)) 18px 0 22px;border-bottom:0;background:#fff;position:relative;gap:10px}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;z-index:1;background:var(--tab,#c9b6ff);transition:background .2s}
.app{grid-template-rows:auto 1fr}
.tabsbar{display:flex;align-items:flex-end;gap:2px;padding-left:4px}
.tabsbar a{position:relative;display:flex;align-items:center;gap:8px;height:40px;padding:0 24px 6px;margin:0 6px;border-radius:16px 16px 0 0;background:color-mix(in srgb,var(--tc) 45%,#fff);color:#3c4043;font-weight:500;text-decoration:none;cursor:pointer;transition:height .15s,background .15s;z-index:0}
.tabsbar a::before,.tabsbar a::after{content:"";position:absolute;bottom:0;width:14px;height:14px;background:radial-gradient(circle at 0 0,transparent 13.5px,color-mix(in srgb,var(--tc) 45%,#fff) 14px)}
.tabsbar a::before{left:-14px;background:radial-gradient(circle at 0 0,transparent 13.5px,color-mix(in srgb,var(--tc) 45%,#fff) 14px)}
.tabsbar a::after{right:-14px;background:radial-gradient(circle at 100% 0,transparent 13.5px,color-mix(in srgb,var(--tc) 45%,#fff) 14px)}
.tabsbar a:hover{height:44px}
.tabsbar a.active{background:var(--tc);height:50px;color:#1f1f1f;z-index:2}
.tabsbar a.active::before{background:radial-gradient(circle at 0 0,transparent 13.5px,var(--tc) 14px)}
.tabsbar a.active::after{background:radial-gradient(circle at 100% 0,transparent 13.5px,var(--tc) 14px)}
.tabsbar a .ms{font-size:19px}
.tabsbar .count{background:#1f1f1f;color:#fff;font-size:11px;border-radius:10px;padding:1px 7px;margin-left:2px}
.tabsbar .count:empty{display:none}
.plus-btn{width:44px;height:44px;border-radius:50%;background:#1f1f1f;color:#fff;display:grid;place-items:center;margin-bottom:10px;box-shadow:0 2px 6px rgba(0,0,0,.18);flex:none}
.plus-btn .ms{font-size:26px}
.plus-btn:hover{background:#3c4043}
.top .role{margin-bottom:10px}
.top .avatar{border-radius:50%}
#v-calendar{background:color-mix(in srgb,var(--tab,#c9b6ff) 18%,#f3f4f7)}
.view:not(#v-calendar){background:color-mix(in srgb,var(--tab) 10%,#fff)}
/* tasks page */
.ph{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.ph h1{margin:0}
.inbox-pill{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:18px;background:#f1f3f4;color:var(--muted);font-size:13px}
.inbox-pill .ms{font-size:18px}
.inbox-pill.has{background:#1f1f1f;color:#fff}
.inbox-pill b{background:#ffb59a;color:#1f1f1f;border-radius:10px;padding:0 7px;margin-left:2px;font-weight:600}
#v-tasks .toolbar{gap:8px}
#v-tasks .search{min-width:200px;background:#fff;border:1px solid var(--line2)}
#v-tasks .fsel{background:#fff}
.lane{background:rgba(255,255,255,.65);border-radius:18px;min-height:120px}
.lane.folded{min-height:0;opacity:.75}
.lane h3{text-transform:none;letter-spacing:0;font-size:14px;color:#3c4043}
.tcard{border:0;border-left:4px solid var(--pc);border-radius:12px;padding:10px 12px;box-shadow:0 1px 2px rgba(60,64,67,.12);margin-bottom:8px}
.tcard .ttl{margin:0 0 8px;font-size:13.5px}
.tcard .meta{gap:6px}
.tcard .avatar{width:20px;height:20px;font-size:9px}
.lane-more{width:100%;padding:6px;border-radius:10px;color:var(--muted);font-size:12.5px}
.lane-more:hover{background:#fff;color:var(--text)}
.side-more{color:#a8c7fa;font-size:12.5px;text-align:left;padding:2px}

/* summary = plan for the rest of the day */
.sum{background:#f7ef8a;color:#1f1f1f;border-radius:22px;padding:16px 16px 12px}
.sum-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;font-size:13px;color:#5c5714}
.sum-h b{font-size:18px;font-weight:500;color:#1f1f1f}
.plan{display:flex;flex-direction:column}
.pl{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid rgba(0,0,0,.08)}
.pl:first-child{border-top:0}
.pl-t{font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.pl-x{min-width:0}
.pl-x b{display:block;font-weight:500;font-size:14px;line-height:1.3;overflow-wrap:anywhere;cursor:default}
.pl-x b[data-evp]{cursor:pointer}
.pl-x small{display:block;font-size:12px;color:#5c5714;margin-top:1px}
.pl button{font-size:12px;font-weight:500;border:1.5px solid #1f1f1f;border-radius:14px;padding:3px 10px;white-space:nowrap}
.pl button:hover{background:rgba(255,255,255,.5)}
.pl.live{background:rgba(255,255,255,.55);border-radius:14px;margin:2px -8px;padding:9px 8px;border-top-color:transparent}
.pl.live small{color:#0b57d0;font-weight:500}
.pl.free .pl-x b{font-weight:400;color:#5c5714}
.pl.free button{border-color:rgba(0,0,0,.25);color:#5c5714}
.pl.dl .pl-t{font-size:12px;color:#c5221f}
.sum-f{font-size:12.5px;color:#5c5714;padding-top:10px;border-top:1px solid rgba(0,0,0,.08);margin-top:2px}
.me-chip{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:4px 14px 4px 4px;border:1px solid var(--line2);border-radius:22px;background:#fff}
.me-chip span{display:flex;flex-direction:column;font-weight:500;font-size:13px;line-height:1.15}
.me-chip small{font-weight:400;color:var(--muted);font-size:11px}

/* =================== LIQUID GLASS THEME =================== */
:root{--g:rgba(255,255,255,.42);--g2:rgba(255,255,255,.66);--g3:rgba(255,255,255,.86);--gb:rgba(255,255,255,.7);--blur:blur(26px) saturate(1.5);--gsh:0 10px 40px rgba(40,64,40,.12),inset 0 1px 0 rgba(255,255,255,.6);--ink:#1d1d1f;--ink2:#55595e;--r:28px}
html,body{background:#cfe0d0}
body{font-family:Inter,Roboto,system-ui,sans-serif;color:var(--ink);letter-spacing:-.005em;
  background:
   radial-gradient(120% 60% at 15% 108%,#86b45e 0,#9fc779 30%,transparent 62%),
   radial-gradient(110% 55% at 85% 112%,#7fae58 0,#a8cd82 34%,transparent 64%),
   radial-gradient(90% 40% at 50% 100%,#b6d58f 0,transparent 70%),
   linear-gradient(180deg,#9fbfdc 0%,#c4d7e6 28%,#e3ebe8 52%,#cfe1bf 74%,#b3d18e 100%) fixed}
.app,.main,.view,.body{background:transparent!important}
.view:not(#v-calendar){background:transparent!important}
#v-calendar{background:transparent!important}
.glass,.cx-cal,.cx-side,.card,.lane,.quad,.kpi,.mlist2,.mdet{background:var(--g)!important;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--gb)!important;box-shadow:var(--gsh);border-radius:var(--r)}
.card{padding:18px 20px}
.card h2{font-weight:600;font-size:15px}
.page h1,.ph h1{font-weight:600;font-size:26px;letter-spacing:-.02em}
.muted,.small.muted{color:var(--ink2)}
/* header: glass divider tabs */
.top{background:transparent!important;border:0!important;padding:14px 22px 0 22px;min-height:70px}
.top::after{display:none}
.tabsbar{gap:6px}
.tabsbar a{height:46px;padding:0 22px;margin:0;border-radius:20px 20px 0 0;background:rgba(255,255,255,.28)!important;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid rgba(255,255,255,.5);border-bottom:0;color:var(--ink2);font-weight:500;box-shadow:none}
.tabsbar a::before,.tabsbar a::after{display:none}
.tabsbar a:hover{height:50px;background:rgba(255,255,255,.45)!important}
.tabsbar a.active{height:56px;background:rgba(255,255,255,.72)!important;color:var(--ink);font-weight:600}
.tabsbar a .ms{font-size:18px;color:inherit}
.tabsbar a.active .ms{color:var(--tc-ink,#1d1d1f)}
.tabsbar a[data-view=calendar]{--dot:#8e7cf0}.tabsbar a[data-view=tasks]{--dot:#f08a5d}.tabsbar a[data-view=meetings]{--dot:#2bb5c4}.tabsbar a[data-view=stats]{--dot:#5bb85b}
.tabsbar a .lbl::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--dot);margin-right:8px;vertical-align:middle;opacity:.9}
.tabsbar .count{background:var(--ink);color:#fff}
.plus-btn{background:var(--g3);color:var(--ink);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--gb);box-shadow:var(--gsh);width:46px;height:46px;margin-bottom:12px}
.plus-btn:hover{background:#fff}
.me-chip{background:var(--g2);border:1px solid var(--gb);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);margin-bottom:12px}
.me-chip small{color:var(--ink2)}
/* controls */
.btn{border-radius:20px;border:1px solid rgba(0,0,0,.08);background:var(--g3);font-weight:500}
.btn:hover{background:#fff}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:#3a3a3d}
.btn.primary:disabled{opacity:.35;cursor:not-allowed}
.btn.tonal{background:rgba(255,255,255,.7);color:var(--ink)}
.btn.text{color:var(--ink);background:transparent;border-color:transparent}
.btn.text:hover{background:rgba(255,255,255,.6)}
.gbtn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 16px;border-radius:18px;background:var(--g3);border:1px solid rgba(255,255,255,.9);font-weight:500;font-size:13px;color:var(--ink);white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.gbtn:hover{background:#fff}
.gbtn.sm{height:28px;padding:0 11px;font-size:12px}
.gbtn .ms{font-size:17px}
.seg{background:rgba(255,255,255,.4);border:1px solid var(--gb);border-radius:20px;padding:3px;gap:2px;display:inline-flex}
.seg button{border-radius:16px;height:32px;color:var(--ink2)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.cx-bar .seg{background:rgba(255,255,255,.45)}
.cx-bar .seg button{color:var(--ink2)}
.cx-bar .seg button[aria-pressed=true]{background:#fff;color:var(--ink)}
.search{background:var(--g3)!important;border:1px solid var(--gb)!important;border-radius:20px}
.inp{border-radius:12px;border-color:rgba(0,0,0,.1);background:rgba(255,255,255,.8)}
.inp.big{background:transparent}
.tag{border-radius:10px}
.lane-more,.side-more{color:var(--ink2)}
/* calendar */
.cx{padding:4px 18px 18px;gap:16px;grid-template-columns:minmax(0,1fr) 370px}
.cx-cal{background:rgba(255,255,255,.55)!important}
.cx-bar{padding:16px 20px 6px 24px}
.cx-bar .date-title{font-weight:600;letter-spacing:-.02em}
.cx-bar .icon-btn{color:var(--ink2)}
.cal-head{background:transparent}
.dayh .dn{color:rgba(29,29,31,.28);font-weight:400}
.dayh.today .dn{color:var(--ink);font-weight:600}
.dayh .dw{color:rgba(29,29,31,.35)}
.col.today-col{background:rgba(255,255,255,.45)}
.slot{border-bottom:1px solid rgba(29,29,31,.05)}
.hours div{color:rgba(29,29,31,.4)}
.ev{background:rgba(255,255,255,.92)!important;border:0!important;border-left:4px solid var(--ec,#9aa0a6)!important;border-radius:14px;box-shadow:0 2px 10px rgba(40,60,40,.10);color:var(--ink)}
.ev.focus{background:rgba(255,255,255,.6)!important;background-image:repeating-linear-gradient(135deg,rgba(142,124,240,.10) 0 6px,transparent 6px 12px)!important}
.allday .dl{border-radius:8px;background:rgba(255,255,255,.9)!important;color:#c5221f!important;font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.now,.now::before{background:var(--ink)}
.month-wrap .mhead{background:transparent}.mcell{border-color:rgba(29,29,31,.06)}.mcell.out,.mcell.we{background:rgba(255,255,255,.15)}
/* side brief */
.cx-side{background:rgba(255,255,255,.5)!important;color:var(--ink);padding:20px}
.brief{display:flex;flex-direction:column;gap:10px}
.br-h{display:flex;justify-content:space-between;align-items:baseline}
.br-h b{font-size:20px;font-weight:600;letter-spacing:-.02em}
.br-h span{font-size:12px;color:var(--ink2)}
.br-lead{margin:0;font-size:15px;line-height:1.45}
.br-s{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin-top:8px}
.bp{background:rgba(255,255,255,.85);border-radius:20px;padding:12px 14px;box-shadow:0 2px 10px rgba(40,60,40,.06)}
.bp.live{box-shadow:0 0 0 2px var(--ink),0 2px 10px rgba(40,60,40,.06)}
.bp-h{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.bp-t{font-size:12px;font-weight:600;background:#f1f2f0;border-radius:10px;padding:3px 8px;font-variant-numeric:tabular-nums}
.bp.live .bp-t{background:var(--ink);color:#fff}
.bp-h b{font-weight:600;font-size:14px;line-height:1.3;cursor:pointer}
.bp ul{margin:8px 0 0;padding-left:18px;font-size:13px;line-height:1.45;color:#33363a}
.bp li{margin:3px 0}
.bp a{color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:rgba(0,0,0,.25);text-underline-offset:2px}
.br-todo{background:rgba(255,255,255,.85);border-radius:20px;padding:4px 14px}
.bt{display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid rgba(0,0,0,.06);font-size:13px;line-height:1.35}
.bt:first-child{border-top:0}
.bt .ms{font-size:18px;color:var(--ink2)}
.bt-x{min-width:0;overflow-wrap:anywhere}
.br-f{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);padding:4px 2px}
/* roadmap */
#dayRoad .rm-board{background:transparent!important;border:0}
.rm-card{background:rgba(255,255,255,.88);border:0;box-shadow:0 2px 12px rgba(40,60,40,.08);border-radius:22px}
.rm-card.focus{background:rgba(255,255,255,.6);background-image:repeating-linear-gradient(135deg,rgba(142,124,240,.08) 0 8px,transparent 8px 16px)}
.rm-card.free{background:rgba(255,255,255,.25);border:1px dashed rgba(29,29,31,.2)}
.rm-card.live{box-shadow:0 0 0 2px var(--ink),0 2px 12px rgba(40,60,40,.08)}
.rm-pill{background:rgba(255,255,255,.7);color:var(--ink);border:1px solid var(--gb)}
.rm-pill .pi{background:#fff;border-color:rgba(0,0,0,.06)}
.rm-pill.live{background:var(--ink);color:#fff}
.rm-pill.past{background:rgba(255,255,255,.35);color:var(--ink2)}
.rm-pill.free{background:transparent}
.rm-node{background:rgba(255,255,255,.85);border-color:var(--gb)}
.rm-node.live{background:var(--ink);color:#fff;box-shadow:0 0 0 6px rgba(29,29,31,.12)}
.rm-node.end{background:var(--ink)}
.rm-track{background:rgba(29,29,31,.12)}.rm-track .done{background:var(--ink)}
.rm-nowpin span{background:var(--ink)}.rm-nowpin::after{background:var(--ink);box-shadow:0 0 0 4px rgba(29,29,31,.15)}
.rm-col::before,.rm-row::after,.rm-row::before{border-color:rgba(29,29,31,.18)!important}
.rm-h b{font-weight:600}
.rm-prog{background:rgba(29,29,31,.08)}.rm-prog i{background:var(--ink)}
/* tasks */
.inbox-pill{background:var(--g2);border:1px solid var(--gb)}
.inbox-pill.has{background:var(--ink)}
.lane{padding:12px}
.lane h3{font-weight:600}
.tcard{background:rgba(255,255,255,.9);border-radius:16px;box-shadow:0 2px 8px rgba(40,60,40,.06)}
.quad{background:var(--g)!important}
.quad h3{color:var(--ink)}
.matrix .mx-ax{color:var(--ink2)}
/* stats */
.ph{display:flex;align-items:baseline;gap:12px;margin:4px 0 18px}
.st-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.st{padding:18px 20px;display:flex;flex-direction:column;gap:4px}
.st-l{font-size:13px;color:var(--ink2);font-weight:500}
.st b{font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.st-d{font-size:12.5px;color:var(--ink2)}
.st-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start}
.kr{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 12px;margin:0 -12px;border-radius:14px;cursor:pointer}

.kr-x b{display:block;font-weight:500;font-size:13.5px}.kr-x span{font-size:12px;color:var(--ink2)}
.kr-d{font-size:12px;color:var(--ink2);white-space:nowrap}
.hl{display:flex;flex-direction:column}
.hli{display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:9px 0;border-top:1px solid rgba(0,0,0,.06);font-size:13px;align-items:start}
.hli:first-child{border-top:0}
.hli .ms{font-size:17px;color:var(--ink2);margin-top:1px}
.hli.deny .ms{color:#c5221f}.hli small{display:block;color:#c5221f;font-size:12px}
.hli-t{font-size:11.5px;color:var(--ink2)}
/* meetings */
.mt-grid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start}
.mlist2{padding:12px;display:flex;flex-direction:column;gap:2px}
.ml-s{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);padding:10px 10px 6px}
.mi{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border-radius:16px;text-align:left;width:100%}
.mi:hover{background:rgba(255,255,255,.5)}
.mi.on{background:rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(40,60,40,.08)}
.mi-x b{display:block;font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mi-x small{font-size:12px;color:var(--ink2)}
.mi-b{font-size:11px;background:var(--ink);color:#fff;border-radius:9px;padding:2px 8px}
.mdet{padding:24px 28px}
.md-h{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:12px}
.md-h h2{margin:0;font-size:22px;font-weight:600;letter-spacing:-.02em}
.md-m{font-size:13px;color:var(--ink2);margin-top:4px}
.md-rec{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:rgba(255,255,255,.8);border-radius:12px;padding:4px 10px;color:var(--ink2)}
.md-rec .ms{font-size:15px}
.md-s{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin:18px 0 8px}
.md-lead{font-size:15.5px;line-height:1.55;margin:0;max-width:760px}
.md-ok,.md-q,.md-r,.md-ag{margin:0;padding-left:0;list-style:none;font-size:14px;line-height:1.45}
.md-ok li,.md-q li,.md-r li{position:relative;padding:6px 0 6px 26px}
.md-ok li::before{content:"✓";position:absolute;left:4px;top:6px;font-weight:700;color:#2e7d32}
.md-q li::before{content:"?";position:absolute;left:6px;top:6px;font-weight:700;color:#b06000}
.md-r li::before{content:"!";position:absolute;left:8px;top:6px;font-weight:700;color:#c5221f}
.md-ag{counter-reset:a}.md-ag li{counter-increment:a;padding:7px 0 7px 30px;position:relative}.md-ag li::before{content:counter(a);position:absolute;left:0;top:6px;width:20px;height:20px;border-radius:50%;background:#fff;font-size:11px;display:grid;place-items:center;font-weight:600}
.md-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.md-qt{margin-top:16px;font-size:13px;color:#33363a}
.md-qt summary{cursor:pointer;color:var(--ink2);font-weight:500}
.md-qt div{padding:6px 0 0 4px}
.md-act{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid rgba(0,0,0,.06)}
.md-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:40px 20px;color:var(--ink2)}
.md-empty .ms{font-size:36px}.md-empty b{color:var(--ink);font-weight:600}
.md-empty span{max-width:380px;font-size:13.5px}
/* modals */
.scrim{background:rgba(40,60,40,.18);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.modal{background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6);border:1px solid rgba(255,255,255,.9);border-radius:30px;box-shadow:0 30px 80px rgba(30,50,30,.25)}
.mh h2{font-weight:600}
.mf{border-top:1px solid rgba(0,0,0,.06)}
.qf{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center;margin:14px 0}
.qf.top{align-items:start}.qf.top label{padding-top:10px}
.qf label{font-size:13px;color:var(--ink2);font-weight:500}
.qf .chip{background:#fff;border-color:rgba(0,0,0,.08)}
.chip-add{height:28px;border-radius:14px;border:1px dashed rgba(0,0,0,.2);background:transparent;padding:0 8px;font-size:12.5px;color:var(--ink2)}
.slots3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot3{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.7);border:1px solid rgba(0,0,0,.06);text-align:left}
.slot3 b{font-size:13px;font-weight:600}.slot3 span{font-size:13px;color:var(--ink2)}
.slot3 i{font-style:normal;font-size:11px;color:#2e7d32;font-weight:500}
.slot3[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.slot3[aria-pressed=true] span{color:rgba(255,255,255,.75)}.slot3[aria-pressed=true] i{color:#b9f6ca}
.why{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--ink2);background:rgba(255,255,255,.6);border-radius:14px;padding:10px 12px;margin-top:6px}
.why .ms{font-size:16px;color:#7b61d9}
.nl-card{background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.9)}
.toast{background:rgba(29,29,31,.88);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:16px}
.pop{background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border:1px solid #fff;border-radius:22px}
.src{background:#fff;border-color:rgba(0,0,0,.08);color:var(--ink)}
.req{border-color:rgba(0,0,0,.06)}

/* ===== round 7: sheet + folder tabs, avatar, create ===== */
.top{padding:14px 18px 0 18px;gap:0;align-items:flex-end;position:relative;z-index:5;overflow:visible}
.me-av{width:42px;height:42px;font-size:16px;border-radius:50%;margin:0 16px 10px 4px;box-shadow:0 0 0 3px rgba(255,255,255,.7);flex:none}
.tabsbar{padding-left:10px;gap:4px}

.new-tab{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 16px 0 12px;margin:0 0 6px 14px;border-radius:19px;background:var(--ink);color:#fff;font-weight:500;font-size:13.5px;box-shadow:0 4px 14px rgba(0,0,0,.15);flex:none}

.page{max-width:none!important}

.mcol{display:flex;flex-direction:column;gap:16px}
.st-hint{font-size:12.5px;color:var(--ink2);margin:-4px 0 10px}
.st-grid{grid-template-columns:1fr 1fr}
.st-tiles .st{min-height:130px}
/* task form */
.tf-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 12px}
.tf-grid .span3{grid-column:1/-1}.tf-grid .span2{grid-column:span 2}

.modal{max-height:calc(100vh - 40px)}

.nl-card dl{align-items:center}

.modal .mf{justify-content:flex-end}

/* round 8 */
.new-tab{background:#fff;color:var(--ink);border:1px solid rgba(255,255,255,.9);box-shadow:0 4px 16px rgba(40,64,40,.15);margin:0 0 12px 12px;height:42px;padding:0 18px 0 14px}

.me-av{cursor:pointer}

.mailcta .ms{font-size:20px;color:var(--ink2)}.mailcta b{display:block;font-size:13.5px;font-weight:600}.mailcta span:not(.ms){font-size:12px;color:var(--ink2)}
.mailcta.in{margin-bottom:6px}
.mailsum{background:rgba(255,255,255,.85);border-radius:20px;padding:12px 14px;box-shadow:0 2px 10px rgba(40,60,40,.06)}

.msr{display:flex;gap:6px;flex-wrap:wrap}
.gbtn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}

.mt{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:start;background:rgba(255,255,255,.75);border-radius:18px;padding:12px 14px;margin-bottom:8px}

.mp-r .ms{color:var(--ink2)}.mp-r b{display:block;font-size:13px;font-weight:600}.mp-r span:not(.ms){font-size:12px;color:var(--ink2)}

/* ===== documents workspace ===== */
.dc-grid{display:grid;grid-template-columns:210px 300px minmax(0,1fr);gap:16px;align-items:start}

.dc-head .ms{font-size:17px}
.dc-f{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;text-align:left;padding:9px 10px;border-radius:14px;background:transparent;font-size:13.5px}

.dc-src span{color:var(--ink2)}

.dc-hint{font-size:11.5px;color:var(--ink2);padding:0 14px 10px;line-height:1.4}
.dc-sample{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;justify-content:center}
.dc-sample button{font:inherit;font-size:12px;padding:5px 9px;border-radius:12px;border:1px solid rgba(0,0,0,.08);background:#fff;color:var(--ink2);cursor:pointer}
.dc-sample button:hover{background:rgba(255,255,255,.75);color:var(--ink)}
.dc-typing{display:inline-flex;gap:4px;align-items:center}
.dc-typing i{width:6px;height:6px;border-radius:50%;background:var(--ink2);animation:dcPulse 1s infinite}
.dc-typing i:nth-child(2){animation-delay:.15s}.dc-typing i:nth-child(3){animation-delay:.3s}
@keyframes dcPulse{0%,100%{opacity:.25}50%{opacity:1}}
.st-src{font-size:11px;color:var(--ink2);margin-top:6px;display:block;line-height:1.4}
.st-list{display:flex;flex-direction:column;gap:2px}
.st-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:8px 0;border-bottom:1px solid rgba(0,0,0,.05)}
.st-row:last-child{border-bottom:0}
.st-row b{font-weight:500;font-size:13.5px}
.st-row small{display:block;font-size:11.5px;color:var(--ink2);margin-top:2px;line-height:1.4}
.st-row span{font-weight:600;font-size:14px}
@media (max-width:1200px){
  .tabsbar a{padding:0 15px}
  .new-tab{margin-left:8px;padding:0 14px 0 10px}
}

  if(dm)deadline=iso(new Date(NOW.getFullYear(),+dm[2]-1,+dm[1]));else if(/послезавтра/.test(low))deadline=iso(addDays(NOW,2));else if(/завтра/.test(low))deadline=iso(addDays(NOW,1));else if(/сегодня/.test(low))deadline=TODAY;else deadline=findDeadline(s)||'';

function busyFor(p,ds){return [...EVENTS.filter(e=>e.date===ds&&e.people.includes(p)&&!e.pending).map(e=>({s:e.s,e:e.e,t:e.title})),...BUSY.filter(b=>b.p===p&&b.date===ds).map(b=>({s:b.s,e:b.e,t:'занят(а)'}))]}
function findSlots(people,dur,opts={}){
  const res=[];const from=opts.from||TODAY;const until=opts.until;
  for(let i=0;i<14&&res.length<12;i++){const d=addDays(parse(from),i);const wd=(d.getDay()+6)%7;if(wd>4)continue;const ds=iso(d);if(until&&ds>until)break;
    for(let s=9;s+dur<=18;s+=.5){
      if(ds===TODAY&&s<nowH()+.5)continue;
      if(overlap(s,s+dur,13,14))continue;
      const clash=people.some(p=>busyFor(p,ds).some(b=>overlap(s,s+dur,b.s,b.e)));if(clash)continue;
      let score=i*4+(s>=16?9:0)+(s<10?1:0)+(s>=10&&s<12?-2:0)+(people.length>3&&s>12?3:0);
      const focus=EVENTS.find(e=>e.date===ds&&e.cal==='focus'&&e.people.includes(me())&&overlap(s,s+dur,e.s,e.e));if(focus)score+=20;
      res.push({ds,s,e:s+dur,score});
    }}
  res.sort((a,b)=>a.score-b.score);
  const pick=[];res.forEach(r=>{if(pick.length<3&&!pick.some(p=>p.ds===r.ds&&Math.abs(p.s-r.s)<2))pick.push(r)});
  return pick.map((r,i)=>{const why=[];why.push('все '+people.length+' участник(а) свободны');if(r.s<12)why.push('утро — выше концентрация');if(opts.deadlineTask&&r.ds<=opts.deadlineTask.deadline)why.push('до дедлайна «'+opts.deadlineTask.title.slice(0,30)+'…»');if(!EVENTS.some(e=>e.date===r.ds&&e.people.includes(me())&&Math.abs(e.e-r.s)<.01))why.push('есть буфер перед встречей');return{...r,why,best:i===0}});
}

function similar(a,b){const w=s=>new Set(s.toLowerCase().replace(/[^а-яёa-z0-9 ]/g,'').split(' ').filter(x=>x.length>3).map(x=>x.slice(0,4)));const A=w(a),B=w(b);let n=0;A.forEach(x=>B.has(x)&&n++);return n<2?0:n/Math.max(1,Math.min(A.size,B.size))}
function openTask(pre={},editId){
  const t=editId?{...TASKS.find(x=>x.id===editId)}:{title:pre.title||'',context:pre.context||'',result:pre.result||'',kpi:pre.kpi||{m:'',t:''},prio:pre.prio||'P3',deadline:pre.deadline||'',owner:pre.owner||null,co:[],source:pre.source||{type:'manual',label:'Вручную'},checkpoints:'',mailId:pre.mailId||null};
  const dupHtml=()=>{const dups=t.title.length>8?TASKS.filter(x=>x.id!==editId&&x.status!=='done'&&similar(t.title,x.title)>=.5):[];return dups.length?`<div class="alert warn"><span class="ms">content_copy</span><div><b>Похоже на существующую задачу:</b>${dups.map(d=>`<div>${d.id} · ${esc(d.title)} — ${d.claimedBy?'в работе у '+PEOPLE[d.claimedBy].short:'свободна'} <a href="#" data-join="${d.id}" style="color:var(--primary)">${d.claimedBy?'подключиться':'взять её'}</a></div>`).join('')}</div></div>`:''};
  const ownHint=()=>{const n=t.owner?TASKS.filter(x=>x.owner===t.owner&&x.status!=='done').length:0;return t.owner?`<div class="hint">Сейчас в работе: ${n} задач${n>=3?' · <span style="color:var(--warn)">высокая загрузка</span>':''}</div>`:''};
  const draw=()=>{

    (()=>{const f=id=>$(id).closest('.field');const res=f('#tRes'),ctx=f('#tCtx'),co=f('#tCo'),src=f('#tSrc'),cp=f('#tCp'),km=f('#tKm'),kt=f('#tKt'),dl=f('#tDl'),own=f('#tOwn'),pr=f('#tPrio');

function aiImprove(t){
  const txt=t.title+' '+t.context;const m=TOPIC_MAP.find(x=>x.k.test(txt));const src=m?m.docs.filter(id=>canSee(DOCS.find(d=>d.id===id))).slice(0,2):[];
  let title=t.title.trim();if(title&&!/^[А-ЯЁ][а-яё]+(ть|ти)\b/.test(title))title=title[0].toUpperCase()+title.slice(1);
  const kpiGuess=/sla|поддерж/i.test(txt)?{m:'SLA первого ответа',t:'≥ 95%'}:/смен|мощн|загрузк/i.test(txt)?{m:'Загрузка линии',t:'≤ 95%'}:/ваканс|найм/i.test(txt)?{m:'Закрытые вакансии',t:'100%'}:/кампан|маркет|лид/i.test(txt)?{m:'Лиды',t:'план кампании'}:/брак|качеств|печат/i.test(txt)?{m:'Доля брака',t:'≤ 1,5%'}:/бумаг|остатк|запас/i.test(txt)?{m:'Запас бумаги',t:'≥ 3 недели'}:/прайс|цен/i.test(txt)?{m:'Средний чек',t:'+8%'}:/бюджет|сверхуроч/i.test(txt)?{m:'Отклонение от бюджета',t:'≤ 5%'}:t.kpi;
  const res=t.result||(kpiGuess.m?kpiGuess.m+' '+kpiGuess.t+', результат зафиксирован в отчёте':'');
  const rows=[['Формулировка',title||'—',!title],['Результат',res||'—',!res],['KPI',(kpiGuess.m?kpiGuess.m+' '+kpiGuess.t:'—'),!kpiGuess.m],['Ответственный',t.owner?PEOPLE[t.owner].name:'Не определён — ассистент не назначает без основания',!t.owner],['Срок',t.deadline?fmtDW(t.deadline):'Не указан в источниках',!t.deadline]];
  return{rows,src,patch:{title,result:res,kpi:kpiGuess.m?kpiGuess:t.kpi,context:t.context||(src[0]?DOCS.find(d=>d.id===src[0]).text.split('.')[0]+' ['+src[0]+']':'')}};
}

const nowStr=()=>{const d=new Date();return pad(d.getDate())+'.'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes())};

function deleteTask(id){
  const t=TASKS.find(x=>x.id===id);if(!t)return;
  const srv=isServerTask(t);
  confirmAct({title:'Удалить задачу?',danger:true,ok:'Удалить',body:`<p style="margin:0">«${esc(t.title)}»${t.owner&&t.owner!==me()?` — ${PEOPLE[t.owner]?.short||t.owner} получит уведомление`:''}</p>`,onOk:async()=>{
    if(srv){
      try{
        const r=await fetch('/api/tasks/'+encodeURIComponent(t.id),{method:'DELETE',credentials:'same-origin'});
        if(!r.ok)throw new Error((await r.json().catch(()=>({}))).detail||('Ошибка '+r.status));
      }catch(e){toast('Не удалось удалить на сервере: '+e.message);return}
    }
    const idx=TASKS.findIndex(x=>x.id===t.id);

function parseTaskLines(text){
  return String(text||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(line=>{
    const [title,owner,deadline,basis]=line.split('|').map(x=>(x||'').trim());
    return {title:title||'',owner:owner||null,deadline:deadline||null,basis:basis||null};
  }).filter(t=>t.title);
}
function taskLines(tasks){
  return (tasks||[]).map(t=>[t.title||'',t.owner||'',t.deadline||'',t.basis||''].join(' | ')).join('\n');
}
function serverTaskToTask(t){
  const isoDate=/^\d{4}-\d{2}-\d{2}$/.test(t.deadline||'')?t.deadline:'';
  const context=[t.basis||('Основание: встреча '+t.event_id),t.deadline&&!isoDate?'Срок из протокола: '+t.deadline:''].filter(Boolean).join(' · ');

}
function addServerTask(t){

function openMeetRecord(e){

    try{recorder=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream)}
    catch(err){stopTracks();setStatus('Браузер не поддерживает запись аудио.',true);return}

  };

const WDRE={'понедельник':0,'вторник':1,'сред':2,'четверг':3,'пятниц':4};
function findDeadline(s){s=s.toLowerCase();for(const k in WDRE){if(s.includes(k)){const target=WDRE[k];const today=(NOW.getDay()+6)%7;let d=target-today;if(d<=0)d+=7;return iso(addDays(NOW,d))}}
  const m=s.match(/(\d{1,2})\s+(января|февраля|марта|апреля|мая|июня|июля|августа|сентября|октября|ноября|декабря)/);if(m){return iso(new Date(NOW.getFullYear(),MON.indexOf(m[2]),+m[1]))}return''}
function nameIn(s,k){return new RegExp('(^|[^а-яё])'+PEOPLE[k].short.slice(0,3).toLowerCase()).test(s.toLowerCase())}
function findOwner(s,speaker){for(const k in PEOPLE){if(nameIn(s,k))return k}return null}
function extract(lines,e){
  const out={decided:[],proposed:[],discussed:[],unclear:[],risks:[],tasks:[],lines,eventId:e?.id,at:nowStr()};
  lines.forEach((l,i)=>{const s=l.txt;const ref=i;
    if(l.note){out.discussed.push({txt:s,ref});return}
    if(/^(решили|договорились|утвердили)|решили:|договорились:/i.test(s))out.decided.push({txt:s.replace(/^(Решили|Договорились)[:,]?\s*/i,''),ref});
    else if(/предлагаю|может быть|можно было бы/i.test(s))out.proposed.push({txt:s,ref});
    else if(/риск|иначе встанем|придётся/i.test(s))out.risks.push({txt:s,ref});
    else if(/непонятно|вернёмся|\?/.test(s))out.unclear.push({txt:s,ref});
    else if(/обсуждали|без решения/i.test(s))out.discussed.push({txt:s,ref});
    // tasks
    const verb=/кто возьм|\?/i.test(s)?null:s.match(/(подготовит|подготовишь|подготовить|посчитай|посчитает|запускает|запустит|сверить|сделает|сделать|проверит|отправит|согласует|нужно)\s+([^.?!]+)/i);
    if(verb){const owner=findOwner(s,l.p);const dl=findDeadline(verb[0])||findDeadline(s);let title=(verb[1]+' '+verb[2]).replace(/\s+(до|к)\s+(понедельник|вторник|сред|четверг|пятниц|\d{1,2}\s+\S+)\S*\s*$/i,'').trim();title=title[0].toUpperCase()+title.slice(1);
      title=title.replace(/,\s*(иначе|чтобы|потому).*$/i,'');const VM={'Подготовит':'Подготовить','Подготовишь':'Подготовить','Посчитай':'Посчитать','Посчитает':'Посчитать','Запускает':'Запустить','Запустит':'Запустить','Сделает':'Сделать','Проверит':'Проверить','Отправит':'Отправить','Согласует':'Согласовать'};title=title.replace(/^(\S+)/,w=>VM[w]||w).replace(/^Нужно\s+/,'');title=title[0].toUpperCase()+title.slice(1);
      out.tasks.push({title,owner,deadline:dl,ref,on:true,status:/ \?|непонятно|кто возьм/i.test(lines[i+1]?.txt||'')?'unclear':'ok'})}
  });
  // "кто возьмёт" pattern -> task without owner
  lines.forEach((l,i)=>{if(/кто возьм[её]т\s+([^?]+)\?/i.test(l.txt)){const m=l.txt.match(/кто возьм[её]т\s+([^?]+)\?/i);const exists=out.tasks.find(t=>similar(t.title,m[1])>=.5);if(exists){exists.owner=null;exists.deadline=''}else out.tasks.push({title:m[1][0].toUpperCase()+m[1].slice(1),owner:null,deadline:'',ref:i,on:true})}});
  return out;
}

function rmPlaceNow(h,autoscroll){

}
