const folderTitle=id=>{const f=FOLDERS.find(x=>x.id===id);return f?f.title:'Без папки'};
function docsFiltered(){
  const q=DOC_QUERY.trim().toLowerCase();
  return SERVER_DOCS.filter(d=>{
    if(DOC_FILTER==='mine'&&!d.created_by)return false;
    if(DOC_FILTER!=='all'&&DOC_FILTER!=='mine'&&d.folder_id!==DOC_FILTER)return false;
    return !q||String(d.title||'').toLowerCase().includes(q);
  });
}
async function loadDocsWorkspace(force){
  if(DOCS_LOADING)return;
  if(DOCS_LOADED&&!force)return;
  DOCS_LOADING=true;
  try{
    const [dr,fr]=await Promise.all([
      fetch('/api/docs',{credentials:'same-origin',cache:'no-store'}),
      fetch('/api/folders',{credentials:'same-origin',cache:'no-store'})
    ]);
    if(dr.ok){const j=await dr.json();SERVER_DOCS=j.items||[];DOCS_CAN_MANAGE=!!j.can_manage}
    if(fr.ok){const j=await fr.json();FOLDERS=j.items||[];DOCS_CAN_MANAGE=DOCS_CAN_MANAGE||!!j.can_manage}
    DOCS_UPDATED_AT=new Date();
    [...DOC_SEL].forEach(id=>{if(!SERVER_DOCS.some(d=>d.id===id))DOC_SEL.delete(id)});
  }catch(e){/* офлайн: пустой список */}
  DOCS_LOADING=false;DOCS_LOADED=true;
  if(currentView==='docs')renderDocs();
}
function dcMsgHtml(m){
  if(m.role==='user')return `<div class="dc-b u">${esc(m.text).replace(/\n/g,'<br>')}</div>`;
  if(m.pending)return `<div class="dc-b a"><div class="dc-who">Ассистент</div><span class="dc-typing"><i></i><i></i><i></i></span></div>`;
  const srcs=(m.sources||[]).map(s=>`<div class="dc-src"><b data-doc="${s.id}">${s.id}</b> · ${esc(s.title)} <span>${fmtD(s.date)}</span>${s.fragment?`<div class="dc-frag">${esc(s.fragment)}</div>`:''}</div>`).join('');
  const err=m.error?` style="border-color:rgba(197,34,31,.3)"`:'';
  return `<div class="dc-b a"${err}><div class="dc-who">Ассистент${m.sources&&m.sources.length?' · источников '+m.sources.length:''}</div><div>${fmtAi(m.answer)}</div>${srcs?`<div class="dc-srcs">${srcs}</div>`:''}${m.masked_preview?`<details class="dc-priv"><summary>Что ушло в модель</summary><pre>${esc(m.masked_preview)}</pre></details>`:''}</div>`;
}
function renderDocs(){
  if(!DOCS_LOADED&&!DOCS_LOADING)loadDocsWorkspace();
  const all=SERVER_DOCS,list=docsFiltered(),mine=SERVER_DOCS.filter(d=>d.created_by);
  const scopeName=DOC_FILTER==='all'?'все доступные документы':(DOC_FILTER==='mine'?'мои загрузки':`папка «${folderTitle(DOC_FILTER)}»`);
  const folderBtns=`<button class="dc-f ${DOC_FILTER==='all'?'on':''}" data-df="all"><span class="ms">folder_open</span><b>Все документы</b><span class="c">${all.length}</span></button>`+
    FOLDERS.map(f=>`<button class="dc-f ${DOC_FILTER===f.id?'on':''}" data-df="${f.id}"><span class="ms">folder</span><b>${esc(f.title)}</b><span class="c">${f.doc_count||0}</span></button>`).join('')+
    `<button class="dc-f ${DOC_FILTER==='mine'?'on':''}" data-df="mine"><span class="ms">note_add</span><b>Мои загрузки</b><span class="c">${mine.length}</span></button>`;
  const docsHtml=list.map(d=>`<div class="dc-doc" data-q="${esc(String(d.title||'').toLowerCase())}"><input type="checkbox" data-dsel="${d.id}" ${DOC_SEL.has(d.id)?'checked':''} aria-label="Использовать ${esc(d.title)}"><div><b data-doc="${d.id}">${esc(d.title)}</b><small>${fmtD(d.date)} · ${esc(folderTitle(d.folder_id))}${d.source_type==='email'?' · письмо':d.created_by?' · моё':''}</small></div></div>`).join('')||'<div class="small muted" style="padding:10px">Ничего не найдено</div>';
  const log=DOC_CHAT.length?DOC_CHAT.map(dcMsgHtml).join(''):`<div class="dc-empty"><span class="ms">auto_awesome</span><b>Спросите по документам</b>Задайте вопрос по ${esc(scopeName)} или отметьте конкретные источники. В ответе будут документ, дата и фрагмент-основание.<div class="dc-sample"><button data-dcq="Проанализируй документы в этой папке: о чём они и что важно?">Проанализировать папку</button><button data-dcq="Что грозит пику спроса в неделю 48?">Что грозит пику в неделю 48?</button><button data-dcq="Какой SLA поддержки и что его роняет?">SLA поддержки</button></div></div>`;
  const manage=DOCS_CAN_MANAGE?`<button class="gbtn" id="dcNewFolder"><span class="ms">folder</span>Папка</button><button class="gbtn" id="dcNewMail"><span class="ms">mail</span>Письмо</button><button class="btn primary" id="dcUpload"><span class="ms">upload_file</span>Загрузить</button>`:`<span class="small muted" style="display:inline-flex;align-items:center;gap:4px"><span class="ms" style="font-size:15px">lock</span>Загрузка — только директор</span>`;
  $('#docsPage').innerHTML=`<div class="ph"><h1>Документы</h1><span class="small muted">${all.length} доступно · ${DOC_SEL.size} выбрано</span><span class="spacer" style="flex:1"></span>${manage}</div>
  <div class="dc-grid">
    <div class="glass dc-pane"><div class="dc-head"><span class="ms">folder_open</span>Папки<span style="flex:1"></span>${DOCS_CAN_MANAGE?'<button class="icon-btn" id="dcManageFolders" title="Управление папками" aria-label="Управление папками"><span class="ms">edit</span></button>':''}</div><div class="dc-list">${folderBtns}</div></div>
    <div class="glass dc-pane"><div class="dc-head"><span class="ms">description</span>Источники<span style="flex:1"></span><button class="icon-btn" id="dcRefresh" title="Обновить" aria-label="Обновить"><span class="ms">refresh</span></button></div>
      <div class="dc-search"><span class="ms">search</span><input id="dcSearch" placeholder="Поиск по названию" aria-label="Поиск по документам" value="${esc(DOC_QUERY)}"></div>
      <div class="dc-list" id="dcList">${docsHtml}</div>
    </div>
    <div class="glass dc-pane dc-chat"><div class="dc-head"><span class="ms">forum</span>Чат по источникам<span style="flex:1"></span><button class="icon-btn" id="dcHelp" title="Как спрашивать" aria-label="Как спрашивать"><span class="ms">help</span></button>${DOC_SEL.size?`<span class="small muted" style="text-transform:none;letter-spacing:0">выбрано ${DOC_SEL.size}</span>${DOC_FILTER!=='all'?'<button class="chip-add" id="dcUseFolder">Вся папка</button>':''}<button class="chip-add" id="dcReset">Сбросить</button>`:`<span class="small muted" style="text-transform:none;letter-spacing:0">${esc(scopeName)}</span>`}</div>
      <div class="dc-log" id="dcLog">${log}</div>
      <div class="dc-hint"><span class="ms" style="font-size:13px">shield</span> В модель уходят только выбранные фрагменты после обезличивания. Аудио не отправляется.</div>
      <div class="dc-compose"><textarea id="dcQ" rows="1" placeholder="Спросите по документам…" aria-label="Вопрос по документам">${esc(DOC_DRAFT)}</textarea><button class="btn primary" id="dcAsk" ${DOC_ASKING?'disabled':''}><span class="ms">send</span>${DOC_ASKING?'Думаю…':'Спросить'}</button></div>
    </div>
  </div>`;
  $$('[data-df]').forEach(b=>b.onclick=()=>{DOC_FILTER=b.dataset.df;DOC_SEL.clear();renderDocs()});
  $$('[data-dsel]').forEach(c=>c.onchange=()=>{if(c.checked&&!DOC_SEL.has(c.dataset.dsel)&&DOC_SEL.size>=8){c.checked=false;toast('Максимум 8 источников на один вопрос');return}c.checked?DOC_SEL.add(c.dataset.dsel):DOC_SEL.delete(c.dataset.dsel);renderDocs()});
  const search=$('#dcSearch');if(search)search.oninput=()=>{DOC_QUERY=search.value;$$('#dcList .dc-doc').forEach(el=>{el.style.display=(el.dataset.q||'').includes(DOC_QUERY.trim().toLowerCase())?'':'none'})};
  const q=$('#dcQ');if(q){q.oninput=()=>{DOC_DRAFT=q.value};q.onkeydown=ev=>{if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();askDocs()}}}
  if($('#dcAsk'))$('#dcAsk').onclick=askDocs;
  if($('#dcHelp'))$('#dcHelp').onclick=openDocsHelp;
  if($('#dcReset'))$('#dcReset').onclick=()=>{DOC_SEL.clear();renderDocs()};
  if($('#dcUseFolder'))$('#dcUseFolder').onclick=()=>{DOC_SEL.clear();renderDocs()};
  if($('#dcRefresh'))$('#dcRefresh').onclick=()=>{DOCS_LOADED=false;loadDocsWorkspace(true)};
  if($('#dcUpload'))$('#dcUpload').onclick=openDocUpload;
  if($('#dcNewMail'))$('#dcNewMail').onclick=openDocEmail;
  if($('#dcNewFolder'))$('#dcNewFolder').onclick=openFolderCreate;
  if($('#dcManageFolders'))$('#dcManageFolders').onclick=openFolderManage;
  $$('[data-dcq]').forEach(b=>b.onclick=()=>{DOC_DRAFT=b.dataset.dcq;renderDocs();askDocs()});
  const lg=$('#dcLog');if(lg)lg.scrollTop=lg.scrollHeight;
}
async function askDocs(){
  if(DOC_ASKING)return;
  const input=$('#dcQ');
  const q=(input?input.value:DOC_DRAFT).trim();
  if(!q){toast('Введите вопрос');return}
  DOC_DRAFT='';DOC_CHAT.push({role:'user',text:q});DOC_CHAT.push({role:'ai',pending:true});
  DOC_ASKING=true;renderDocs();
  try{
    const scope=DOC_SEL.size?{doc_ids:[...DOC_SEL]}:(DOC_FILTER==='mine'?{mine:true}:(DOC_FILTER!=='all'?{folder_id:DOC_FILTER}:{}));
    const r=await fetch('/api/assistant/ask',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({q,...scope})});
    const data=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(data.detail||('Ошибка '+r.status));
    DOC_CHAT[DOC_CHAT.length-1]={role:'ai',...data};
  }catch(err){
    DOC_CHAT[DOC_CHAT.length-1]={role:'ai',error:err.message,answer:'Не удалось получить ответ: '+err.message,sources:[]};
  }
  DOC_ASKING=false;renderDocs();
}
function folderOptions(selected){
  if(!FOLDERS.length)return '<option value="F-REG" data-acl="all">Регламенты и общее</option>';
  return FOLDERS.map(f=>`<option value="${f.id}" data-acl="${f.acl}" ${f.id===selected?'selected':''}>${esc(f.title)}</option>`).join('');
}
function bindFolderAcl(folderSel,aclSel){
  if(!folderSel||!aclSel)return;
  const sync=()=>{const opt=folderSel.selectedOptions[0];const acl=opt&&opt.dataset.acl;if(acl)aclSel.value=acl};
  folderSel.onchange=sync;
}
function aclOptions(selected){
  return Object.keys(ACL_NAMES).map(k=>`<option value="${k}" ${k===selected?'selected':''}>${ACL_NAMES[k]}</option>`).join('');
}

    const fd=new FormData();fd.append('file',f);fd.append('title',$('#duTitle').value.trim());fd.append('acl',$('#duAcl').value);fd.append('folder_id',$('#duFolder').value);
    try{
      const r=await fetch('/api/docs',{method:'POST',body:fd,credentials:'same-origin'});

  };

function renderMonth(){

  const last=new Date(f.getFullYear(),f.getMonth()+1,0);const weeks=Math.ceil((daysBetween(iso(st),iso(last))+1)/7);
  $('#dateTitle').innerHTML=MONN[f.getMonth()]+'<span class="yr">, '+f.getFullYear()+'</span>';
  const evs=visibleEvents(),dl=deadlineItems();
  let h=`<div class="mhead">${WD.map(w=>`<div>${w.toUpperCase()}</div>`).join('')}</div><div class="mgrid" style="grid-template-rows:repeat(${weeks},1fr)">`;
  for(let i=0;i<weeks*7;i++){const d=addDays(st,i),ds=iso(d);
    const items=[...dl.filter(t=>t.deadline===ds).map(t=>({k:'t',t})),...evs.filter(e=>e.date===ds).sort((a,b)=>a.s-b.s).map(e=>({k:'e',e}))];
    const show=items.slice(0,3),more=items.length-show.length;

      <button class="mnum ${ds===TODAY?'today':''}" data-goto-day="${ds}" aria-label="${fmtDW(ds)}">${d.getDate()===1?d.getDate()+' '+MON[d.getMonth()].slice(0,3):d.getDate()}</button>

  $('#monthWrap').innerHTML=h+'</div>';
}

  'assistant.ask':'Запрос к ассистенту','assistant.doc_denied':'Доступ к документу через ассистента',
  'assistant.pii_block':'Запрос к ассистенту','assistant.rate_limited':'Запрос к ассистенту',
  'doc.upload':'Загрузка документа','doc.delete':'Удаление документа','doc.edit':'Изменение документа',
  'doc.view':'Просмотр документа','doc.access_denied':'Доступ к документу',
  'doc.folder_create':'Создание папки','meeting.record':'Запись встречи','meeting.edit':'Правка выжимки',
  'meeting.tasks_create':'Задачи из встречи','meeting.feedback':'Обратная связь по AI',
  'meeting.delete':'Удаление выжимки','meeting.access_denied':'Доступ к встрече',
  'role.switch':'Смена роли','auth.auto':'Вход в систему','auth.logout':'Выход'
};
function mergeServerAudit(items){
  const seen=new Set(AUDIT.map(a=>`${a.action}|${a.obj}|${Math.floor(a.ts.getTime()/60000)}`));
  (items||[]).forEach(it=>{
    const action=SERVER_ACTION_TEXT[it.action]||it.action;
    const ts=new Date(it.ts);
    const key=`${action}|${it.obj}|${Math.floor(ts.getTime()/60000)}`;
    if(seen.has(key))return;
    seen.add(key);
    AUDIT.push({ts,u:it.user_id,action,obj:it.obj,result:it.result,server:true});
  });
  AUDIT.sort((a,b)=>b.ts-a.ts);
}
function renderAudit(){
  const L=AUDIT.filter(a=>histF==='all'||histKind(a)===histF);
  const today=L,groups=[['Сегодня',today]];
  $('#histList').innerHTML=L.length?groups.map(([g,items])=>`<div class="hgroup">${g}</div>`+items.map(a=>{const k=histKind(a);const who=a.u===me()?'Вы':(PEOPLE[a.u]?.short||a.u);
    let verb=HIST_TEXT[a.action]||a.action.toLowerCase();if(a.u!==me()&&PEOPLE[a.u]){const f=PEOPLE[a.u].g==='f';verb=verb.replace(/([а-яё]+)лись(?![а-яё])/g,(m,r)=>r+(f?'лась':'лся')).replace(/([а-яё]+)ли(?![а-яё])/g,(m,r)=>r+(f?'ла':'л'))}
    const text=k==='ai'?`<b>Ассистент</b> ${AI_TEXT[a.action]||a.action.replace(/^AI:\s*/,'').toLowerCase()}`:`<b>${a.u===me()?'Вы':(PEOPLE[a.u]?.name||a.u)}</b> ${verb}`;
    const ic=k==='deny'?['lock','var(--err)','var(--err-bg)']:k==='ai'?['auto_awesome','#7b4fd6','#f3e8fd']:[/встреч|повестк|запис/i.test(a.action)?'event':/задач|заявк|статус/i.test(a.action)?'task_alt':/перен/i.test(a.action)?'event_repeat':'person','var(--primary)','var(--primary-soft)'];
    const res=a.result&&a.result!=='успешно'?a.result.replace(/ОТКЛОНЕНО:\s*/,'Отказано: '):'';
    return `<div class="hrow"><span class="hic" style="color:${ic[1]};background:${ic[2]}"><span class="ms">${ic[0]}</span></span><div class="htxt"><div>${text}${a.obj&&a.obj!=='сессия'?` <span class="hobj">«${esc(String(a.obj))}»</span>`:''}</div>${res?`<div class="small ${k==='deny'?'':'muted'}" style="${k==='deny'?'color:var(--err)':''}">${esc(res)}</div>`:''}</div><span class="htime">${pad(a.ts.getHours())}:${pad(a.ts.getMinutes())}</span></div>`}).join('')).join('')
  :'<div class="empty">Здесь пока ничего нет</div>';
}

/* ============ ROLE / AUDIT / GLOBAL ============ */
function updateCounts(){const m=me();const n=REQUESTS.filter(r=>r.to===m&&r.status==='pending'&&r.kind!=='feedback').length;$('#cReq').textContent=n||'';$('#cReq').style.display=n?'':'none';$('#cTasks').textContent=TASKS.filter(t=>t.status!=='done'&&(t.owner===m)).length;}

function refresh(keepModal){updateCounts();const v=currentView;if(v==='calendar')renderCal();if(v==='tasks')renderBoard();if(v==='meetings')renderMeetings();if(v==='docs')renderDocs();if(v==='stats')renderStats();if(!keepModal&&$('#scrim').classList.contains('on')&&!$('#okBtn')){}}
const OPEN={create:()=>openCreate(),meeting:()=>openMeeting(),task:()=>openTask(),request:()=>openRequest(),reschedule:()=>openReschedule()};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#scrim').classList.contains('on'))closeModal();else{closePop();closeMenu();if(notifEl){notifEl.remove();notifEl=null}}return}
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)||document.activeElement.isContentEditable||$('#scrim').classList.contains('on'))return;
  if(e.key==='c'||e.key==='с'){e.preventDefault();openCreate()}
  if(e.key==='t'||e.key==='е'){anchor=new Date(NOW);show('calendar')}
});
setInterval(()=>{if(currentView==='calendar'){const n=$('.now');if(n)n.style.top=`calc(var(--hour)*${nowH()})`}},60000);

/* init */
$('#meAvatar').style.background=PEOPLE.anna.color;$('#meAvatar').textContent='А';
$('#inboxBtn').onclick=openInbox;updateCounts();
const h0=(location.hash||'').slice(1);show(['calendar','today','tasks','requests','meetings','docs','audit','stats'].includes(h0)?h0:'calendar');scrollToWork();
</script>
